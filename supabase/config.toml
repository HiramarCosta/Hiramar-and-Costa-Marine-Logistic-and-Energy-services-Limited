# Supabase CLI configuration.
# Created so `supabase link --project-ref pewmcfatznoonjkatnuf` works
# straight away. See https://supabase.com/docs/guides/cli/config

project_id = "pewmcfatznoonjkatnuf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
